apiVersion: v1
kind: Service
metadata:
  name: {{ include "apz-unifiedapp-web.fullname" . }}
  labels:
    {{- include "apz-unifiedapp-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: prometheus
      port: {{ .Values.ports.metricsPort }}
      targetPort: http
      protocol: TCP
    - name: glowroot
      port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    {{- include "apz-unifiedapp-web.selectorLabels" . | nindent 4 }}
