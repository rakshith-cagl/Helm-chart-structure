# Default values for apz-unifiedapp-web.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/unifieddev/apz-unifiedapp-web
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1"

imagePullSecrets:
 - name: default-dockercfg-vr4nb
nameOverride: ""
fullnameOverride: "apz-unifiedapp-web"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations:
  prometheus.io/port: "8871"
  prometheus.io/scrape: "true"

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

securityContext:
  readOnlyRootFilesystem: false
  runAsUser: 1000
  privileged: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
    - ALL
  
service:
  #type: LoadBalancer
  port: 8080

ingress:
  enabled: false
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/timeout: 300s
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: apz-unifiedapp-web-unifieddev.apps.drprunificls.corp.grameenkoota.org 
      paths: 
        - /UnifiedApp
  tls: 
    - secretName: APZCBO-tls-secret-web
      hosts:
        - apz-unifiedapp-web-unifieddev.apps.drprunificls.corp.grameenkoota.org 

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 2000m
     memory: 4000Mi
   requests:
     cpu: 500m
     memory: 1000Mi

# default values
ports:
  containerPort: 8080
  protocol: TCP
  metricsPort: 8871

liveness:
  port: http
  periodSeconds: 300
  timeoutSeconds: 10
  failureThreshold: 5

readiness:
  port: http
  periodSeconds: 300
  timeoutSeconds: 10
  failureThreshold: 5

startup:
  port: http
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 2

terminationGracePeriodSeconds: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  env: sit 

tolerations: []

affinity: {}


contextPath: /UnifiedApp
envMountPath: /opt/jws/tomcat/lib
appId: APZCBO
usersettingsPath: /var/app_volume/usersettings
pvcUserSettingsName: nfs-usersettingspvc


nameSpace: unifieddev
  
APZCBO:
  publicPem: ""
  # redisSecret: ""
  # redisCreds: ""
  registrySecret: "ewogICAgICAgICJhdXRocyI6IHsKICAgICAgICAgICAgICAgICJhcnRpZmFjdG9yeS5hcHB6aWxsb24uY29tIjogewogICAgICAgICAgICAgICAgICAgICAgICAiYXV0aCI6ICJZMkZuYkRwek0wTjFjak5rUUhWM0l5WTFNdz09IgogICAgICAgICAgICAgICAgfQogICAgICAgIH0KfQo="
  tlsCrt: ""
  tlsKey: ""

openshift:
  cluster: true
