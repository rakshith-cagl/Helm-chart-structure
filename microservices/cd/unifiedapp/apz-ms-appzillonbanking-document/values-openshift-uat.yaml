# Default values for apz-ms-appzillonbanking-document.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/maitri-unnathi/apz-ms-appzillonbanking-document
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1"

imagePullSecrets:
 - name: default-dockercfg-njfqp
nameOverride: ""
fullnameOverride: "apz-ms-appzillonbanking-document"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations:
  prometheus.io/port: "8871"
  prometheus.io/scrape: "true"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}

service:
  type: ClusterIP
  port: 9283

ingress:
  enabled: false
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: 'true'
    haproxy.router.openshift.io/timeout: 300s
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: apz-ms-appzillonbanking-document-maitri-unnathi.apps.ocpdr.corp.grameenkoota.org
      paths:
        - /appzillonbankingdocument
  tls:
    - secretName: common-tls-secret-server
      hosts:
        - apz-ms-appzillonbanking-document-maitri-unnathi.apps.ocpdr.corp.grameenkoota.org

resources: 
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 2000m
     memory: 4000Mi
   requests:
     cpu: 300m
     memory: 1000Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 20
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

volumeMounts:
  configPath: /app

enviroment: uat

# default values

ports:
  containerPort: 9283
  protocol: TCP

liveness:
  port: http
  periodSeconds: 300
  timeoutSeconds: 10
  failureThreshold: 5

readiness:
  port: http
  periodSeconds: 300
  timeoutSeconds: 10
  failureThreshold: 5

startup:
  port: http
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 2

terminationGracePeriodSeconds: 60

nameSpace: maitri-unnathi
contextPath: /appzillonbankingdocument
secretAppTag: common

openshift:
  cluster: true
